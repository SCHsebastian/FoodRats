			shellScript = "if [ \"YES\" = \"$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED\" ]; then\n  echo \"Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \\\"YES\\\"\"\n  exit 0\nfi\n\n# Resolve JAVA_HOME for Xcode's stripped PATH.\nfind_java() {\n  # 1. JAVA_HOME already set\n  if [ -n \"$JAVA_HOME\" ] && [ -x \"$JAVA_HOME/bin/java\" ]; then return; fi\n  # 2. java_home helper (any version)\n  for v in 21 17 11; do\n    if H=$(/usr/libexec/java_home -v $v 2>/dev/null) && [ -n \"$H\" ]; then\n      export JAVA_HOME=\"$H\"; return\n    fi\n  done\n  if H=$(/usr/libexec/java_home 2>/dev/null) && [ -n \"$H\" ]; then\n    export JAVA_HOME=\"$H\"; return\n  fi\n  # 3. Common app-bundle JDKs\n  for P in \\\n    \"/Applications/Android Studio.app/Contents/jbr/Contents/Home\" \\\n    \"/Applications/Android Studio Preview.app/Contents/jbr/Contents/Home\" \\\n    \"$HOME/Applications/Android Studio.app/Contents/jbr/Contents/Home\" \\\n    \"/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home\" \\\n    \"/Applications/IntelliJ IDEA CE.app/Contents/jbr/Contents/Home\" \\\n    \"$HOME/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home\" \\\n    \"$HOME/Applications/IntelliJ IDEA CE.app/Contents/jbr/Contents/Home\"; do\n    if [ -x \"$P/bin/java\" ]; then export JAVA_HOME=\"$P\"; return; fi\n  done\n  # 4. JetBrains Toolbox installs\n  for D in \"$HOME/Library/Application Support/JetBrains/Toolbox/apps\"/*/*/*\"/Android Studio.app/Contents/jbr/Contents/Home\" \\\n           \"$HOME/Library/Application Support/JetBrains/Toolbox/apps\"/*/*/*\"/IntelliJ IDEA.app/Contents/jbr/Contents/Home\"; do\n    if [ -x \"$D/bin/java\" ]; then export JAVA_HOME=\"$D\"; return; fi\n  done\n  # 5. Gradle-provisioned (foojay) JDKs in ~/.gradle/jdks\n  for D in \"$HOME\"/.gradle/jdks/*/Contents/Home \"$HOME\"/.gradle/jdks/*; do\n    if [ -x \"$D/bin/java\" ]; then export JAVA_HOME=\"$D\"; return; fi\n  done\n  # 6. Homebrew openjdk\n  for P in /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \\\n           /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \\\n           /opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home \\\n           /usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \\\n           /usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \\\n           /usr/local/opt/openjdk/libexec/openjdk.jdk/Contents/Home; do\n    if [ -x \"$P/bin/java\" ]; then export JAVA_HOME=\"$P\"; return; fi\n  done\n  # 7. Generic search under /Library/Java/JavaVirtualMachines\n  for D in /Library/Java/JavaVirtualMachines/*/Contents/Home; do\n    if [ -x \"$D/bin/java\" ]; then export JAVA_HOME=\"$D\"; return; fi\n  done\n}\nfind_java\nif [ -z \"$JAVA_HOME\" ] || [ ! -x \"$JAVA_HOME/bin/java\" ]; then\n  echo \"error: Could not locate a Java runtime. Install JDK (brew install openjdk@21) or Android Studio.\" >&2\n  echo \"Searched: java_home, /Applications, ~/Applications, JetBrains Toolbox, ~/.gradle/jdks, Homebrew openjdk, /Library/Java/JavaVirtualMachines.\" >&2\n  exit 1\nfi\nexport PATH=\"$JAVA_HOME/bin:$PATH\"\necho \"Using JAVA_HOME=$JAVA_HOME\"\n\ncd \"$SRCROOT/..\"\n./gradlew :shared:embedAndSignAppleFrameworkForXcode\n";
