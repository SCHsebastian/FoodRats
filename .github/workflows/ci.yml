name: CI

# Validates every PR and every push to the protected branches.
#
#  - host-tests:   the cross-platform host test suite. None of the tested
#                  modules apply the Firebase/googleServices plugin, so this
#                  job needs NO secrets and runs identically on fork PRs.
#  - ios-tests:    runs the iOS-simulator unit tests for the non-Firebase modules
#                  on the self-hosted Mac runner (the same one release uses).
#                  Skipped on fork PRs so untrusted code never touches the runner.
#  - release-smoke: builds the minified (R8) release AAB so ProGuard config
#                  errors surface on the PR. Self-contained: it synthesizes a
#                  placeholder google-services.json and disables the Crashlytics
#                  mapping upload, so it also needs no secrets.
#  - baseline-profile: generates the Baseline Profile on a Gradle Managed Device
#                  emulator (roadmap §5.3). Manual-only (workflow_dispatch): a
#                  hardware-accelerated emulator needs KVM, which GitHub's FREE
#                  ubuntu runners do NOT expose, so it cannot run on every push for
#                  zero cost. See the job comment for the honest limitation + the
#                  exact local/device command to regenerate + commit the profile.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  # Manual trigger for the device-bound Baseline Profile job (see baseline-profile below).
  workflow_dispatch:

# Least privilege: the workflow only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      # :core:domain hosts the whole-project architecture fitness functions
      # (ArchitectureFitnessTest + KonsistRulesTest), so they run here too.
      # :feature:meal-ai is intentionally omitted: it has `withHostTest {}` wired
      # but no androidHostTest sources yet, so its test task is NO-SOURCE (a no-op).
      # Add :feature:meal-ai:testAndroidHostTest here once it gains host tests.
      - name: Run host tests
        run: >
          ./gradlew --no-daemon
          :core:domain:testAndroidHostTest
          :feature:auth:testAndroidHostTest
          :feature:crew:testAndroidHostTest
          :feature:meal:testAndroidHostTest
          :feature:feed:testAndroidHostTest
          :feature:stats:testAndroidHostTest
          :feature:notifications:testAndroidHostTest
          :feature:ingredient:testAndroidHostTest
          :core:designsystem:testAndroidHostTest
          :shared:testAndroidHostTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: host-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

  ios-tests:
    name: iOS unit tests (sim)
    # The self-hosted Mac runner is the only host that can link Kotlin/Native iOS
    # binaries. Gate to pushes + same-repo PRs so a fork PR never runs untrusted
    # code on the self-hosted runner (see cicd-runbook §3.4).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only the Firebase-free modules link iosSimulatorArm64Test. Everything that
      # depends on :core:data (auth, crew, meal, notifications, feed, stats, shared)
      # needs the Xcode-resolved FirebaseCore SPM framework, absent at Gradle link
      # time, so it's excluded until that's wired (see "iOS status" in CLAUDE.md).
      # :core:i18n and :core:designsystem have no iOS test sources today (the task is
      # NO-SOURCE); they're listed so coverage is automatic if iOS tests are added.
      - name: Run iOS simulator unit tests (non-Firebase modules)
        run: >
          ./gradlew --no-daemon
          :core:domain:iosSimulatorArm64Test
          :core:presentation:iosSimulatorArm64Test
          :core:i18n:iosSimulatorArm64Test
          :core:designsystem:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

  release-smoke:
    name: Release smoke (R8)
    runs-on: ubuntu-latest
    # Heavy (~9 min) R8 build: run only on pushes to main, not on every PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      # The googleServices plugin (applied in :androidApp) needs a structurally
      # valid google-services.json. The real one is a secret; for a build-only
      # smoke we synthesize a placeholder with the correct package name. It is
      # never shipped — the resulting AAB is unsigned and discarded.
      - name: Synthesize placeholder google-services.json
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "foodrats-ci-placeholder",
              "storage_bucket": "foodrats-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "es.schsebastian.foodrats" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY00" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build minified release AAB (unsigned, no Crashlytics upload)
        run: >
          ./gradlew --no-daemon :androidApp:bundleRelease
          -PcrashlyticsMappingUpload=false

  baseline-profile:
    name: Baseline Profile (GMD)
    # ─────────────────────────────────────────────────────────────────────────
    # HONEST LIMITATION (roadmap §5.3, zero-paid-infra constraint):
    #   Generating a real Baseline Profile / running the StartupBenchmark needs a
    #   running Android emulator, and a *hardware-accelerated* emulator needs KVM
    #   (/dev/kvm). GitHub's FREE `ubuntu-latest` runners do NOT expose nested
    #   virtualization — a software-emulated (`-no-accel`) boot is too slow/flaky
    #   to gate CI on for free. So this job is MANUAL ONLY (workflow_dispatch).
    #
    #   The `enable-kvm` step below succeeds on *larger* GitHub runners and on a
    #   self-hosted Linux host with KVM; on a free runner the Gradle GMD task will
    #   fail to boot the emulator. The job is therefore `continue-on-error` and its
    #   outcome is informational — it does NOT block merges. The authoritative way
    #   to (re)generate the profile is on a local device/emulator; that command is
    #   in docs/session/human.md and the module report.
    # ─────────────────────────────────────────────────────────────────────────
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      # KVM access for the managed-device emulator. No-op (and the emulator boot
      # later fails) on runners without nested virtualization — see the note above.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm — emulator boot will fail on this runner (expected on free runners)"

      # The googleServices plugin (applied in :androidApp) needs a structurally
      # valid google-services.json to even configure the app under test.
      - name: Synthesize placeholder google-services.json
        run: |
          cat > androidApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "foodrats-ci-placeholder",
              "storage_bucket": "foodrats-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "es.schsebastian.foodrats" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDUMMYKEYDUMMYKEYDUMMYKEYDUMMYKEY00" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      # Boots the Pixel 6 / API 34 AOSP-ATD managed device, installs the app +
      # benchmark, and writes the profile back into :androidApp. Best-effort.
      - name: Generate Baseline Profile on the managed device
        run: >
          ./gradlew --no-daemon :androidApp:generateBaselineProfile
          -PcrashlyticsMappingUpload=false

      - name: Upload generated profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-profile
          path: 'androidApp/src/release/generated/baselineProfiles/**'
          if-no-files-found: ignore
          retention-days: 14
