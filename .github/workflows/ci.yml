name: CI

# Runs the cross-platform host test suite on every PR and on pushes to the
# protected branches. Firebase config is reconstructed from repository secrets
# at build time so that google-services.json never lives in the repo.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Least privilege: the workflow only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize Firebase config from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty or missing"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      - name: Provide Google server client id
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          echo "googleServerClientId=${GOOGLE_SERVER_CLIENT_ID}" >> gradle.properties

      - name: Run host tests
        run: >
          ./gradlew --no-daemon
          :core:domain:testAndroidHostTest
          :feature:auth:testAndroidHostTest
          :feature:crew:testAndroidHostTest
          :feature:meal:testAndroidHostTest
          :feature:feed:testAndroidHostTest
          :feature:stats:testAndroidHostTest
          :feature:notifications:testAndroidHostTest
          :core:designsystem:testAndroidHostTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7
