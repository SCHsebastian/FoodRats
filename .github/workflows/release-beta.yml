name: Release (beta)

# On every push to main: build, sign and ship to the beta tracks
# (Play Internal testing + TestFlight). Fully automatic — no production here.
# Android runs on free GitHub-hosted Linux; iOS runs on the self-hosted Mac
# runner (label: macos) so we never pay for cloud macOS minutes.

on:
  push:
    branches: [main]
  # Manual re-run (e.g. after adding signing secrets or fixing the self-hosted
  # runner) without needing an empty commit to main.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-upload.
concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  android:
    name: Android → Play Internal
    # Self-hosted Mac runner: the upload keystore + passwords live on the machine
    # (sourced from ~/.config/foodrats/signing.env) and never touch GitHub.
    runs-on: [self-hosted, macos]
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags for the version name

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby + Fastlane
        # Self-hosted macOS: use the runner's Homebrew Ruby (ruby/setup-ruby
        # assumes the hosted-runner tool-cache path and fails with EACCES).
        run: |
          set -euo pipefail
          BREW_RUBY="$(brew --prefix ruby)/bin"
          echo "$BREW_RUBY" >> "$GITHUB_PATH"
          export PATH="$BREW_RUBY:$PATH"
          chmod -R u+rwX "$(ruby -e 'print Gem.dir')" 2>/dev/null || true
          ruby -v
          gem install bundler:2.5.23 --no-document
          bundle install

      - name: Compute version
        run: ./scripts/ci/compute_version.sh beta >> "$GITHUB_ENV"

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty or missing"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      - name: Provide Google server client id
        run: echo "googleServerClientId=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" >> gradle.properties

      - name: Build signed AAB (minified)
        # Upload keystore + passwords come from the local, untracked signing env.
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          ./gradlew --no-daemon :androidApp:bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Upload to Play Internal
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          PLAY_JSON_KEY_PATH="$PLAY_SERVICE_ACCOUNT_PATH" bundle exec fastlane android beta

  ios:
    name: iOS → TestFlight
    runs-on: [self-hosted, macos]
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby + Fastlane
        # Self-hosted macOS runner: ruby/setup-ruby@v1 assumes the GitHub-hosted
        # tool-cache path and dies with `EACCES: mkdir '/Users/runner'`. Use the
        # Homebrew Ruby already installed on the runner instead.
        run: |
          set -euo pipefail
          BREW_RUBY="$(brew --prefix ruby)/bin"
          echo "$BREW_RUBY" >> "$GITHUB_PATH"
          export PATH="$BREW_RUBY:$PATH"
          # Defensive: make the gem dir writable for the runner user (no sudo).
          chmod -R u+rwX "$(ruby -e 'print Gem.dir')" 2>/dev/null || true
          ruby -v
          gem install bundler:2.5.23 --no-document
          bundle install

      - name: Compute version
        run: ./scripts/ci/compute_version.sh beta >> "$GITHUB_ENV"

      - name: Materialize GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Install CocoaPods (MealAiVision / MediaPipe)
        # iosApp/Pods is gitignored; the committed iosApp.xcworkspace references it,
        # so the pods must be resolved before gym archives. Uses the runner's
        # Homebrew CocoaPods (Podfile.lock is committed → deterministic resolve).
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          pod install --project-directory=iosApp

      - name: Build & upload to TestFlight
        # ASC API key (.p8) + match creds come from the local, untracked signing
        # env (~/.config/foodrats/signing.env), same as the Android jobs — nothing
        # signing-related is stored on GitHub.
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          bundle exec fastlane ios beta
