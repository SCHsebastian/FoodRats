name: Release (beta)

# On every push to main: build, sign and ship to the beta tracks
# (Play Internal testing + TestFlight). Fully automatic — no production here.
# Android runs on free GitHub-hosted Linux; iOS runs on the self-hosted Mac
# runner (label: macos) so we never pay for cloud macOS minutes.

on:
  push:
    branches: [main]
  # Manual re-run (e.g. after adding signing secrets or fixing the self-hosted
  # runner) without needing an empty commit to main.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-upload.
concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  android:
    name: Android → Play Internal
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags for the version name

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Compute version
        run: ./scripts/ci/compute_version.sh beta >> "$GITHUB_ENV"

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty or missing"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      - name: Provide Google server client id
        run: echo "googleServerClientId=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" >> gradle.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB (minified)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :androidApp:bundleRelease
          -PversionName="$VERSION_NAME"
          -PversionCode="$VERSION_CODE"

      - name: Upload to Play Internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_PATH="$RUNNER_TEMP/play.json" bundle exec fastlane android beta

  ios:
    name: iOS → TestFlight
    runs-on: [self-hosted, macos]
    environment: beta
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby + Fastlane
        # Self-hosted macOS runner: ruby/setup-ruby@v1 assumes the GitHub-hosted
        # tool-cache path and dies with `EACCES: mkdir '/Users/runner'`. Use the
        # Homebrew Ruby already installed on the runner instead.
        run: |
          set -euo pipefail
          BREW_RUBY="$(brew --prefix ruby)/bin"
          echo "$BREW_RUBY" >> "$GITHUB_PATH"
          export PATH="$BREW_RUBY:$PATH"
          # Defensive: make the gem dir writable for the runner user (no sudo).
          chmod -R u+rwX "$(ruby -e 'print Gem.dir')" 2>/dev/null || true
          ruby -v
          gem install bundler:2.5.23 --no-document
          bundle install

      - name: Compute version
        run: ./scripts/ci/compute_version.sh beta >> "$GITHUB_ENV"

      - name: Materialize GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta
