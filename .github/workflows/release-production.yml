name: Release (production)

# Triggered by pushing a SemVer tag (vX.Y.Z). Builds from the tagged commit and
# ships to production: Play 'production' track (staged 20% rollout) and the
# App Store (phased release, submitted for review).
#
# "prod manual": both deploy jobs target the protected `production` GitHub
# Environment, which has required reviewers — the run pauses until a human
# approves before anything reaches the stores. Configure the environment under
# Settings → Environments → production (see docs/cicd-runbook.md).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  android:
    name: Android → Play Production
    # Self-hosted Mac runner: the upload keystore + passwords live on the machine
    # (sourced from ~/.config/foodrats/signing.env) and never touch GitHub.
    runs-on: [self-hosted, macos]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby + Fastlane
        # Self-hosted macOS: use the runner's Homebrew Ruby (ruby/setup-ruby
        # assumes the hosted-runner tool-cache path and fails with EACCES).
        run: |
          set -euo pipefail
          BREW_RUBY="$(brew --prefix ruby)/bin"
          echo "$BREW_RUBY" >> "$GITHUB_PATH"
          export PATH="$BREW_RUBY:$PATH"
          chmod -R u+rwX "$(ruby -e 'print Gem.dir')" 2>/dev/null || true
          ruby -v
          gem install bundler:2.5.23 --no-document
          bundle install

      - name: Compute version
        run: ./scripts/ci/compute_version.sh prod >> "$GITHUB_ENV"

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty or missing"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      - name: Provide Google server client id
        run: echo "googleServerClientId=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" >> gradle.properties

      - name: Build signed AAB (minified)
        # Upload keystore + passwords come from the local, untracked signing env.
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          ./gradlew --no-daemon :androidApp:bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Upload to Play Production (20% rollout)
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          PLAY_JSON_KEY_PATH="$PLAY_SERVICE_ACCOUNT_PATH" bundle exec fastlane android release

  ios:
    name: iOS → App Store
    runs-on: [self-hosted, macos]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby + Fastlane
        # Self-hosted macOS runner: ruby/setup-ruby@v1 assumes the GitHub-hosted
        # tool-cache path and dies with `EACCES: mkdir '/Users/runner'`. Use the
        # Homebrew Ruby already installed on the runner instead.
        run: |
          set -euo pipefail
          BREW_RUBY="$(brew --prefix ruby)/bin"
          echo "$BREW_RUBY" >> "$GITHUB_PATH"
          export PATH="$BREW_RUBY:$PATH"
          # Defensive: make the gem dir writable for the runner user (no sudo).
          chmod -R u+rwX "$(ruby -e 'print Gem.dir')" 2>/dev/null || true
          ruby -v
          gem install bundler:2.5.23 --no-document
          bundle install

      - name: Compute version
        run: ./scripts/ci/compute_version.sh prod >> "$GITHUB_ENV"

      - name: Materialize GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Build & submit to App Store
        # ASC API key (.p8) + match creds come from the local, untracked signing
        # env (~/.config/foodrats/signing.env), same as the Android jobs — nothing
        # signing-related is stored on GitHub.
        run: |
          set -a; source "$HOME/.config/foodrats/signing.env"; set +a
          bundle exec fastlane ios release

  github-release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
