name: Release (production)

# Triggered by pushing a SemVer tag (vX.Y.Z). Builds from the tagged commit and
# ships to production: Play 'production' track (staged 20% rollout) and the
# App Store (phased release, submitted for review).
#
# "prod manual": both deploy jobs target the protected `production` GitHub
# Environment, which has required reviewers — the run pauses until a human
# approves before anything reaches the stores. Configure the environment under
# Settings → Environments → production (see docs/cicd-runbook.md).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  android:
    name: Android → Play Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Compute version
        run: ./scripts/ci/compute_version.sh prod >> "$GITHUB_ENV"

      - name: Materialize Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty or missing"; exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > androidApp/google-services.json

      - name: Provide Google server client id
        run: echo "googleServerClientId=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" >> gradle.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB (minified)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :androidApp:bundleRelease
          -PversionName="$VERSION_NAME"
          -PversionCode="$VERSION_CODE"

      - name: Upload to Play Production (20% rollout)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > "$RUNNER_TEMP/play.json"
          PLAY_JSON_KEY_PATH="$RUNNER_TEMP/play.json" bundle exec fastlane android release

  ios:
    name: iOS → App Store
    runs-on: [self-hosted, macos]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Compute version
        run: ./scripts/ci/compute_version.sh prod >> "$GITHUB_ENV"

      - name: Materialize GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Build & submit to App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios release

  github-release:
    name: GitHub Release notes
    runs-on: ubuntu-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
