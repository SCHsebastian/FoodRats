[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "30"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.7.1"
androidx-core = "1.18.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0-beta01"
androidx-testExt = "1.3.0"
robolectric = "4.15.1"
composeMultiplatform = "1.11.0"
junit = "4.13.2"
kotlin = "2.3.21"
material3 = "1.11.0-alpha07"

koin = "4.2.1"
kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.8.0-0.6.x-compat"
kotlinxSerialization = "1.7.3"
ktor = "3.1.0"
datastore = "1.2.1"
imagepickerkmp = "1.0.41"
gitliveFirebase = "2.1.0"
googleId = "1.1.1"
credentials = "1.3.0"
turbine = "1.2.1"
kotest = "5.9.1"
navCompose = "2.9.2"
okio = "3.9.1"
konsist = "0.17.3"
firebaseBom = "33.5.1"
googleServices = "4.4.2"
firebaseCrashlyticsPlugin = "3.0.2"
roborazzi = "1.40.0"
androidxWork = "2.10.0"
androidxLifecycleProcess = "2.9.0"
coil = "3.4.0"
# MediaPipe Tasks Vision — on-device food classifier (:feature:meal-ai).
# 0.10.35 ships 16-KB-page-aligned native .so (libmediapipe_tasks_vision_jni.so),
# required for Play submissions targeting Android 15+ since 2025-11-01. Earlier pins
# (e.g. 0.10.14) emit 4-KB-aligned LOAD segments and are rejected by Play.
# Keep in lockstep with the iOS MediaPipeTasksVision cocoapod pin in iosApp/Podfile.
mediapipeTasksVision = "0.10.35"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# material-icons-core: pinned to 1.6.2 — this is the last published KMP version.
# CMP 1.7+ bundles icons differently; revisit when upgrading CMP.
materialIconsCore     = { module = "org.jetbrains.compose.material:material-icons-core",     version = "1.6.2" }
materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatform" }

koin-core              = { module = "io.insert-koin:koin-core",                 version.ref = "koin" }
koin-android           = { module = "io.insert-koin:koin-android",              version.ref = "koin" }
koin-compose           = { module = "io.insert-koin:koin-compose",              version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel",    version.ref = "koin" }
koin-test              = { module = "io.insert-koin:koin-test",                 version.ref = "koin" }

kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",   version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",   version.ref = "kotlinxCoroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",          version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

ktor-client-core           = { module = "io.ktor:ktor-client-core",                version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json    = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Per-platform Ktor engines used by Coil's KtorNetworkFetcherFactory.
ktor-client-okhttp         = { module = "io.ktor:ktor-client-okhttp",              version.ref = "ktor" }
ktor-client-darwin         = { module = "io.ktor:ktor-client-darwin",              version.ref = "ktor" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

imagepickerkmp = { module = "io.github.ismoy:imagepickerkmp", version.ref = "imagepickerkmp" }

firebase-auth      = { module = "dev.gitlive:firebase-auth",      version.ref = "gitliveFirebase" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "gitliveFirebase" }
firebase-storage   = { module = "dev.gitlive:firebase-storage",   version.ref = "gitliveFirebase" }
# Callable Cloud Functions (mintPlateUrls) for membership-checked signed image URLs.
# Used only by core:data's FirebaseImageUrlResolver — kept out of the firebase-gitlive
# bundle so the other Firebase modules don't pull it transitively.
firebase-functions = { module = "dev.gitlive:firebase-functions", version.ref = "gitliveFirebase" }
firebase-messaging = { module = "dev.gitlive:firebase-messaging", version.ref = "gitliveFirebase" }
firebase-common    = { module = "dev.gitlive:firebase-common",    version.ref = "gitliveFirebase" }
# Firebase BOM — pins the com.google.firebase:* artifacts the GitLive KMP wrappers
# pull in transitively on Android. Applied via `platform(libs.firebase.bom)` in every
# Firebase-touching module's androidMain (was a hardcoded literal repeated in 5 files).
firebase-bom       = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
# Firebase Analytics (GA4) — no GitLive KMP binding; native SDK reached from androidMain only
# (FirebaseAnalyticsTracker), iOS bridged via Swift (mirrors Crashlytics). Pinned by the BOM above.
firebase-analytics   = { module = "com.google.firebase:firebase-analytics" }
# Remote Config — backs the FeatureFlagPort kill-switch (no GitLive KMP binding; native SDK
# reached from androidMain only). Version pinned by the BOM above.
firebase-config      = { module = "com.google.firebase:firebase-config" }

androidx-credentials                    = { module = "androidx.credentials:credentials",                          version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth",       version.ref = "credentials" }
google-id                               = { module = "com.google.android.libraries.identity.googleid:googleid",  version.ref = "googleId" }

nav-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navCompose" }

turbine                = { module = "app.cash.turbine:turbine",          version.ref = "turbine" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core",  version.ref = "kotest" }
konsist                = { module = "com.lemonappdev:konsist",           version.ref = "konsist" }
okio                   = { module = "com.squareup.okio:okio",            version.ref = "okio" }
roborazzi              = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose      = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-work-runtime      = { module = "androidx.work:work-runtime-ktx",           version.ref = "androidxWork" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process",     version.ref = "androidxLifecycleProcess" }

# Coil 3 — multiplatform image loader (Android + iOS). Used by FrFeedMealCard for meal photos.
# coil-network-ktor3 plugs into the existing Ktor 3 client so we don't pull a second HTTP stack.
coil-core          = { module = "io.coil-kt.coil3:coil",               version.ref = "coil" }
coil-compose       = { module = "io.coil-kt.coil3:coil-compose",       version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# MediaPipe Tasks Vision (Android). 16-KB-aligned .so — see version note above.
mediapipe-tasks-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipeTasksVision" }

[bundles]
# NB: dashed bundle names nest in the generated accessor, exactly like libraries —
# `feature-ui` is reached as `libs.bundles.feature.ui` (NOT `featureUi`).
#
# The identical Compose UI + Koin + lifecycle stack every feature module's commonMain
# declares. Collapses an ~10-line block repeated across all 8 feature modules.
feature-ui = [
    "compose-runtime", "compose-foundation", "compose-material3", "compose-ui",
    "compose-components-resources",
    "koin-core", "koin-compose", "koin-compose-viewmodel",
    "androidx-lifecycle-viewmodelCompose", "androidx-lifecycle-runtimeCompose",
]
# The kotlinx trio every feature carries.  -> libs.bundles.kotlinx.common
kotlinx-common = ["kotlinx-coroutines-core", "kotlinx-serialization-json", "kotlinx-datetime"]
# GitLive Firebase KMP bindings, declared together by Firebase-touching modules. -> libs.bundles.firebase.gitlive
firebase-gitlive = ["firebase-common", "firebase-auth", "firebase-firestore", "firebase-storage"]
# commonTest stack shared by feature modules.  -> libs.bundles.feature.test
feature-test = ["kotlin-test", "kotest-assertions-core", "turbine", "kotlinx-coroutines-test", "koin-test"]
# androidHostTest base for non-Compose feature modules (Koin/VM logic on the host). -> libs.bundles.feature.hosttest
feature-hosttest = ["kotlin-testJunit", "junit", "koin-test", "kotlinx-coroutines-test", "turbine"]
# androidHostTest stack for modules with Robolectric Compose UI tests. -> libs.bundles.compose.hosttest
compose-hosttest = ["kotlin-testJunit", "junit", "androidx-testExt-junit", "compose-ui-test-junit4", "robolectric"]

[plugins]
androidApplication             = { id = "com.android.application",                       version.ref = "agp" }
androidMultiplatformLibrary    = { id = "com.android.kotlin.multiplatform.library",      version.ref = "agp" }
composeMultiplatform           = { id = "org.jetbrains.compose",                         version.ref = "composeMultiplatform" }
composeCompiler                = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
kotlinMultiplatform            = { id = "org.jetbrains.kotlin.multiplatform",            version.ref = "kotlin" }
kotlinxSerialization           = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
googleServices                 = { id = "com.google.gms.google-services",                version.ref = "googleServices" }
firebaseCrashlytics            = { id = "com.google.firebase.crashlytics",                version.ref = "firebaseCrashlyticsPlugin" }
