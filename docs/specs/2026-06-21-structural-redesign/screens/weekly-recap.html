<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodRats · Your week in food</title>
<link rel="stylesheet" href="../structural.css">
</head>
<body>
<div class="stage">
  <div class="device" data-theme="dark">

    <!-- full-bleed media: the week's top plate -->
    <div class="media dish-ramen"></div>
    <div class="media fill" style="background-image:url(https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=900&h=1600&fit=crop)"></div>
    <div class="scrim" style="background:linear-gradient(180deg,rgba(7,8,5,.72) 0%,rgba(7,8,5,.15) 32%,rgba(7,8,5,.55) 64%,#0b0c08 96%)"></div>

    <!-- story progress (8 segments) -->
    <div class="rowx gap6" style="position:absolute;z-index:5;top:14px;left:16px;right:16px">
      <div style="flex:1;height:3px;border-radius:9px;background:#fff"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
      <div style="flex:1;height:3px;border-radius:9px;background:rgba(255,255,255,.28)"></div>
    </div>

    <div class="rowx between center" style="position:absolute;z-index:5;top:26px;left:16px;right:16px">
      <span class="micro white" style="opacity:.8">saturday brunch · recap</span>
      <button class="glass-btn" style="width:38px;height:38px"><span class="material-symbols-rounded ico-20">close</span></button>
    </div>

    <!-- the slide -->
    <div class="screen">
      <div class="plane" style="justify-content:flex-end;padding:64px 26px 40px;gap:0;min-height:100%">

        <span class="eyebrow" style="color:#fff;opacity:.8">your week in food</span>
        <h1 class="title-xl on-media" style="font-size:34px;margin:10px 0 0;max-width:280px">A quick recap of your crew's week</h1>
        <span class="micro mono white" style="opacity:.7;margin-top:8px">sat 15 – sat 21 jun</span>

        <div style="flex:1;min-height:40px"></div>

        <!-- the reveal -->
        <span class="micro white" style="opacity:.8">your crew cooked</span>
        <div class="rowx" style="align-items:flex-end;gap:10px;margin-top:2px">
          <span class="metric on-media" style="font-size:128px;line-height:.78">18</span>
          <span class="title-xl white" style="padding-bottom:20px">plates</span>
        </div>

        <!-- micro stat array -->
        <div class="micro-row white" style="opacity:.92;margin-top:14px;gap:8px">
          <span class="streak w800">▲ +3 vs last week</span><span class="sep"></span>
          <span>8.1 ★ avg</span><span class="sep"></span>
          <span>4 / 4 showed up</span><span class="sep"></span>
          <span class="mono">🔥 12 best</span>
        </div>

        <!-- continue affordance -->
        <div class="tile near rowx center gap12 tap" style="margin-top:24px">
          <span class="avatar s40 rust-ring" style="background:#7A3826">RK</span>
          <div class="col grow"><span class="micro olive">up next</span><span class="title-md white">Your crew's top plate</span></div>
          <span class="material-symbols-rounded ico-24 white">chevron_right</span>
        </div>

      </div>
    </div>

  </div>
</div>
</body>
</html>
