<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodRats · Join with code</title>
<link rel="stylesheet" href="../structural.css">
</head>
<body>
<div class="stage">
  <div class="device" data-theme="dark">

    <!-- Z0 — warm atmospheric media floor (no photo) -->
    <div class="media field"></div>
    <!-- Z1 — legibility scrim -->
    <div class="scrim" style="background:linear-gradient(180deg,rgba(8,9,6,.5),transparent 30%,rgba(8,9,6,.66) 82%,#0c0d08)"></div>

    <!-- status row -->
    <div class="statusrow">
      <span>9:41</span>
      <span class="sig"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span>
    </div>

    <!-- Z2 — scrolling content plane -->
    <div class="screen">
      <div class="plane" style="padding:88px 26px 56px;gap:0;min-height:100%">

        <!-- brand hero (centered) -->
        <div class="col center" style="text-align:center">
          <img src="../assets/logo-crew.svg" width="92" height="80" alt="" style="filter:brightness(0) invert(1) drop-shadow(0 10px 24px rgba(0,0,0,.5))">
          <h1 class="metric on-media" style="font-size:56px;margin:18px 0 0;letter-spacing:-.04em">FoodRats</h1>
          <p class="body bright" style="font-size:17px;margin:12px 0 0;max-width:260px">Eat together, even apart.</p>
        </div>

        <div style="flex:1;min-height:40px"></div>

        <!-- mode toggle row -->
        <div class="rowx gap8" style="margin-bottom:22px">
          <a href="crew-create.html" class="chip glass grow" style="justify-content:center;height:42px;font-size:14px;text-decoration:none">Create a crew</a>
          <span class="chip sel grow" style="justify-content:center;height:42px;font-size:14px">Join with code</span>
        </div>

        <!-- join form -->
        <div class="tile near col gap20" style="padding:22px">
          <div class="field focus"><span class="lab">invite code</span><input class="inp mono" placeholder="RAT-4FK" style="letter-spacing:2px;text-transform:uppercase"></div>
          <button class="btn primary block">Join</button>
        </div>

        <!-- footer -->
        <p class="micro tac bright" style="margin:26px 0 0;text-transform:none;letter-spacing:.01em;font-weight:600">Ask a member for the crew's invite code.</p>

      </div>
    </div>

  </div>
</div>
</body>
</html>
