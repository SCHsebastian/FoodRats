<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodRats · Blocked users</title>
<link rel="stylesheet" href="../structural.css">
</head>
<body>
<div class="stage">
  <div class="device" data-theme="dark">

    <!-- Z0 — atmospheric warm media floor (no photo) -->
    <div class="media field"></div>
    <!-- Z1 — legibility scrim -->
    <div class="scrim even"></div>

    <!-- status row -->
    <div class="statusrow">
      <span>9:41</span>
      <span class="sig"><span class="material-symbols-rounded">signal_cellular_alt</span><span class="material-symbols-rounded">wifi</span><span class="material-symbols-rounded">battery_full</span></span>
    </div>

    <!-- pushed-screen header: floating back + centered title -->
    <div class="rowx between center" style="position:absolute;z-index:5;top:52px;left:0;right:0;padding:8px 16px 0">
      <button class="glass-btn"><span class="material-symbols-rounded ico-24">arrow_back</span></button>
      <div class="col center"><span class="micro olive">safety</span><span class="title-md white">Blocked users</span></div>
      <span style="width:44px;height:44px;flex:none"></span>
    </div>

    <!-- Z2 — scrolling content plane -->
    <div class="screen">
      <div class="plane" style="padding-top:104px;gap:18px;justify-content:center">

        <!-- empty state -->
        <div class="tile deep col center gap14" style="text-align:center;padding:40px 28px">
          <span class="material-symbols-rounded dim" style="font-size:40px;opacity:.55">no_accounts</span>
          <div class="col center gap8">
            <span class="title-lg white">No one blocked</span>
            <span class="body" style="font-size:14px">People you block won't appear in your feed, stats, or comments.</span>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
</body>
</html>
