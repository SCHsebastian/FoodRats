#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
# Native cache stays enabled now that nav-compose is on a stable release (2.9.2)
# with proper ios_simulator_arm64 + ios_arm64 klibs.

#Gradle
# Release iOS framework linking runs Kotlin/Native LTO (DevirtualizationAnalysis)
# inside the Gradle daemon and OOMs at 4G. 8G covers the Release archive (16G RAM).
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
# Parallelize configuration-cache store/load across the 21 modules (Gradle 9.1+).
org.gradle.configuration-cache.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# R8 "full mode" (AGP 8+ default) does NOT preserve the default constructor of a
# `-keep class X` rule — it only keeps such constructors when there's a visible
# `new X()`. Room and Firebase both instantiate classes purely by REFLECTION
# (Room's generated `*_Impl` DBs; Firebase's `ComponentRegistrar`s during component
# discovery), and their bundled consumer rules keep only the CLASS, not `<init>()`.
# Under full mode those constructors get stripped, so the release build instant-crashed
# at startup ("WorkDatabase_Impl.<init> []" → then "FirebaseCrashlytics component is not
# present"). Compat mode restores ProGuard semantics (kept classes keep their default
# constructor), making every library's consumer rules behave as authored. The explicit
# `<init>()` keeps in androidApp/proguard-rules.pro are belt-and-suspenders for this.
android.enableR8.fullMode=false
