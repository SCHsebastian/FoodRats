#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M
# Native cache stays enabled now that nav-compose is on a stable release (2.9.2)
# with proper ios_simulator_arm64 + ios_arm64 klibs.

#Gradle
# Release iOS framework linking runs Kotlin/Native LTO (DevirtualizationAnalysis)
# inside the Gradle daemon and OOMs at 4G. 8G covers the Release archive (16G RAM).
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
