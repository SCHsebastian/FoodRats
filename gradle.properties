#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# navigation-runtime 2.8.0-alpha10 triggers a K/N cache-build failure with Kotlin 2.3.21
# ("Function FUN AUXILIARY_GENERATED_DECLARATION ... is not found").
# iOS framework link is a known-failing step; Android + commonMain compilation succeeds.
# TODO: upgrade nav-compose once a version compatible with K 2.3.21 is released.
kotlin.native.cacheKind=none
kotlin.native.cacheKind.iosSimulatorArm64=none

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true