# Build-script approvals (pnpm 11 reads these here, not from package.json). These
# deps ship prebuilt platform binaries as optional deps, so the tests pass even if
# the scripts don't run — approving just silences the ERR_PNPM_IGNORED_BUILDS gate.
allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  re2: true
# Security floors for transitive dev/test deps (pnpm 11 reads overrides here, not
# from the package.json "pnpm" field). Forces every nested copy up to the patched
# version regardless of which parent pulled it in.
#   esbuild  GHSA-67mh-4wv8-2f99 (<=0.24.2)  -> >=0.25.0
#   vite     GHSA-fx2h-pf6j-xcff (<=6.4.2)   -> >=6.4.3
#   js-yaml  GHSA-h67p-54hq-rp68 (<=4.1.1)   -> >=4.2.0
#   uuid     GHSA-w5hq-g745-h8pq (<11.1.1)   -> >=11.1.1
overrides:
  esbuild: ">=0.25.0"
  vite: ">=6.4.3"
  js-yaml: ">=4.2.0"
  uuid: ">=11.1.1"
